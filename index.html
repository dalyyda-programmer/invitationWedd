<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>معرض الصور</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body.no-scroll {
      overflow: hidden;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Traditional Arabic', 'Amiri', 'Times New Roman', serif;
      background-color: #111;
      overflow-x: hidden;
    }

    .mobile-wrapper {
      width: 100vw;
      max-width: 430px;
      min-height: 100vh;
      margin: 0 auto;
      position: relative;
      background-image: url('6.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .card-section {
      height: 100vh;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1500px;
      position: relative;
    }

    .envelope-container {
      width: 100%;
      height: 100vh;
      position: relative;
      cursor: pointer;
    }

    .intro-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .door-left {
      width: 50%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
      overflow: hidden;
      transform-origin: left center;
      transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .door-left img {
      width: 200%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      left: 0;
    }

    .door-right {
      width: 50%;
      height: 100%;
      position: absolute;
      top: 0;
      right: 0;
      z-index: 2;
      overflow: hidden;
      transform-origin: right center;
      transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .door-right img {
      width: 200%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      right: 0;
    }

    .envelope-container.open .door-left {
      transform: rotateY(-110deg);
    }

    .envelope-container.open .door-right {
      transform: rotateY(110deg);
    }

    .timer-container {
      position: absolute;
      top: 22%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 16px;
      direction: ltr;
      z-index: 10;
      background: transparent;
      padding: 0;
    }

    .timer-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 45px;
    }

    .timer-val {
      font-size: 24px;
      font-weight: 600;
      color: #6d5b4f;
      font-family: 'Traditional Arabic', 'Amiri', serif;
    }

    .timer-label {
      font-size: 13px;
      color: #8c786b;
      margin-top: -2px;
      font-family: 'Traditional Arabic', 'Amiri', serif;
    }

    .location-btn {
      position: absolute;
      top: 57.5%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      color: #6d5b4f;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      font-family: 'Traditional Arabic', 'Amiri', serif;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .location-btn:hover {
      opacity: 0.8;
    }

    .scroll-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .image-wrapper {
      position: relative;
      width: 100%;
      height: 100vh;
    }

    .scroll-image {
      width: 100%;
      height: 100vh;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body class="no-scroll">

  <!-- ملف الصوت المرفوع باسمه الحالي -->
  <audio id="bg-music" src="ليلة خميس .. محمد عبده .mp3" loop></audio>

  <div class="mobile-wrapper">
    <!-- 1. قسم المغلف -->
    <section class="card-section">
      <div class="envelope-container" onclick="openEnvelope(this)">
        <img class="intro-image" src="3.png" alt="صورة الإنترو">
        <div class="door-left">
          <img src="1.png" alt="غلاف يسار">
        </div>
        <div class="door-right">
          <img src="2.png" alt="غلاف يمين">
        </div>
      </div>
    </section>

    <!-- 2. قسم صور السكرول -->
    <section class="scroll-section">
      <img class="scroll-image" src="4.png" alt="صورة 1">
      
      <div class="image-wrapper">
        <img class="scroll-image" src="ك.يسرا م.أنس .png" alt="صورة 2">
        
        <div class="timer-container">
          <div class="timer-box">
            <span class="timer-val" id="days">00</span>
            <span class="timer-label">أيام</span>
          </div>
          <div class="timer-box">
            <span class="timer-val" id="hours">00</span>
            <span class="timer-label">ساعات</span>
          </div>
          <div class="timer-box">
            <span class="timer-val" id="minutes">00</span>
            <span class="timer-label">دقائق</span>
          </div>
          <div class="timer-box">
            <span class="timer-val" id="seconds">00</span>
            <span class="timer-label">ثواني</span>
          </div>
        </div>

        <a href="https://maps.app.goo.gl/Tqob4b6fQn1Kw9p76" target="_blank" class="location-btn">
          انقري هنا
        </a>
      </div>
    </section>
  </div>

  <script>
    function openEnvelope(element) {
      element.classList.toggle('open');
      document.body.classList.remove('no-scroll');
      
      const music = document.getElementById('bg-music');
      if (music) {
        music.play();
      }
    }

    const targetDate = new Date("Sep 23, 2026 00:00:00").getTime();

    const timerInterval = setInterval(function() {
      const now = new Date().getTime();
      const difference = targetDate - now;

      if (difference < 0) {
        clearInterval(timerInterval);
        document.getElementById("days").innerText = "00";
        document.getElementById("hours").innerText = "00";
        document.getElementById("minutes").innerText = "00";
        document.getElementById("seconds").innerText = "00";
        return;
      }

      const days = Math.floor(difference / (1000 * 60 * 60 * 24));
      const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((difference % (1000 * 60)) / 1000);

      document.getElementById("days").innerText = String(days).padStart(2, '0');
      document.getElementById("hours").innerText = String(hours).padStart(2, '0');
      document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
      document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
    }, 1000);
  </script>

</body>
</html>
